services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      # Nunca reutilizar as credenciais do Supabase presentes no .env da aplicação.
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-moringa}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-etl_local}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Defina LOCAL_POSTGRES_PASSWORD para o banco local}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      # schema.sql inclui as migrações por caminhos relativos.
      - ./app/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres18_data:
